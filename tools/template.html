<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel E. Finol-González — Computer &amp; Data Scientist</title>
<meta name="description" content="Daniel E. Finol-González: computer and data scientist (MSc), 13 years teaching graduate machine learning, statistics and mathematics. Résumé and full CV, in English and Spanish.">
<meta name="color-scheme" content="light dark">
<script>
/* Only an explicit choice made on this site is applied here; otherwise the browser/OS setting decides (see CSS). */
(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
/* Light is the default when no browser/OS preference can be detected; a dark system setting switches to dark. */
:root{--bg:#fbf1c7;--fg:#3c3836;--muted:#665c54;--rule:#d5c4a1;--accent:#af3a03;--accent2:#427b58;--hover:#f2e5bc;--focus:#b57614;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#ebdbb2;--muted:#a89984;--rule:#3c3836;--accent:#fe8019;--accent2:#8ec07c;--hover:#12100f;--focus:#fabd2f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#000;--fg:#ebdbb2;--muted:#a89984;--rule:#3c3836;--accent:#fe8019;--accent2:#8ec07c;--hover:#12100f;--focus:#fabd2f;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.65 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;transition:background .2s,color .2s}
.wrap{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
.ui,button,.bar a,.vbar a{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
a{color:var(--accent);text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.bar{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;justify-content:space-between;align-items:center;font-size:.875rem;line-height:1.4}
.nav{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem}
.nav a{color:var(--muted);text-decoration:none;padding:.3rem 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--fg)}
.nav a[aria-current=page]{color:var(--fg);border-bottom-color:var(--accent)}
.ctl{display:flex;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.btn,.seg button{background:transparent;color:var(--fg);border:1px solid var(--rule);border-radius:5px;padding:.4rem .75rem;font-size:.875rem;line-height:1.2;cursor:pointer}
.seg button{border:0;border-radius:0}
.btn:hover,.seg button:hover{background:var(--hover)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
header{padding:3.25rem 0 1.75rem}
h1{margin:0;font-size:clamp(2.1rem,7vw,3.4rem);line-height:1.1;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.sub{margin:.9rem 0 0;font-size:1.2rem;font-style:italic;color:var(--muted);text-wrap:balance}
.contact{margin:1.25rem 0 0;display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;font-size:.95rem;color:var(--muted)}
body[data-view=home] header{text-align:center;padding:4.5rem 0 .5rem}
body[data-view=home] .contact{justify-content:center}

/* Landing */
.home{text-align:center}
.lead{font-size:clamp(1.3rem,3.4vw,1.65rem);line-height:1.45;font-weight:500;max-width:37rem;margin:1.75rem auto 0;text-wrap:balance}
.para{max-width:35rem;margin:1.25rem auto 0;font-size:1.05rem;line-height:1.65;text-wrap:pretty}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:2.75rem 0 0;text-align:left}
.choice{position:relative;border:1px solid var(--rule);border-radius:6px;padding:1.4rem 1.4rem 1.2rem;transition:border-color .15s,background .15s}
.choice.main{border-color:var(--accent)}
.choice:hover{background:var(--hover);border-color:var(--accent)}
.choice h2{margin:0;font:600 1.5rem/1.25 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.choice h2 a{color:inherit;text-decoration:none}
.choice h2 a::after{content:"";position:absolute;inset:0;border-radius:6px}
.choice h2 a:focus-visible{outline:none}
.choice h2 a:focus-visible::after{outline:2px solid var(--focus);outline-offset:3px}
.choice:hover h2 a{color:var(--accent)}
.choice .d{margin:.5rem 0 0;color:var(--muted);font-size:1rem;line-height:1.55}
.choice .pdf{margin:1rem 0 0;font-size:.875rem}
.choice .pdf a{position:relative;z-index:1}

/* Résumé / CV views */
.vbar{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between;align-items:center;padding:.5rem 0;font-size:.875rem}
.lnk{background:none;border:0;color:var(--muted);font-size:.875rem;cursor:pointer;padding:.25rem 0;text-decoration:underline;text-underline-offset:.2em}
.lnk:hover{color:var(--accent)}
.lsec{border-top:1px solid var(--rule);padding:1.5rem 0 1.4rem}
.lsec h2{margin:0 0 .6rem;font:600 1.45rem/1.25 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.lsec p{margin:0;max-width:40rem}
.sec{border-top:1px solid var(--rule)}
.sec:last-child{border-bottom:1px solid var(--rule)}
h2{margin:0;font:inherit}
.sec h2 button{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:.35rem 1rem;width:100%;text-align:left;background:none;border:0;color:inherit;padding:1.5rem 0;cursor:pointer;font-family:inherit}
.sec h2 button:hover .t{color:var(--accent)}
.t{font:600 1.45rem/1.25 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;transition:color .15s}
.m{display:inline-flex;align-items:center;gap:.75rem;color:var(--accent2);font:.85rem/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap}
.chev{width:.6rem;height:.6rem;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.open .chev{transform:rotate(225deg) translate(-2px,-2px)}
.sum{grid-column:1/-1;color:var(--muted);font:1rem/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;max-width:40rem}
.panel{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}
.open .panel{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s}
.pin{overflow:hidden;min-height:0}
.note{margin:0 0 .75rem;color:var(--muted);font-size:.95rem;font-style:italic}
ul{margin:0;padding:0 0 1.75rem;list-style:none}
li{position:relative;padding:.5rem 0 .5rem 1.5rem;overflow-wrap:break-word}
li::before{content:"";position:absolute;left:.15rem;top:1.12rem;width:.42rem;height:.42rem;background:var(--accent2)}
li .subl{display:block;color:var(--muted);font-size:.95rem;margin-top:.2rem}
li ul.in{padding:.3rem 0 .2rem}
li ul.in li{padding:.3rem 0 .3rem 1.25rem}
li ul.in li::before{top:.85rem;width:.34rem;height:.34rem;background:none;border:1.5px solid var(--accent2);border-radius:50%}
sup{font-size:.7em;line-height:0}
.totop{position:fixed;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:5px;padding:.55rem .9rem;font-size:.875rem;line-height:1.2;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s,border-color .15s}
.totop.show{opacity:1;visibility:visible;transition:opacity .2s,border-color .15s}
.totop:hover{border-color:var(--accent);color:var(--accent)}
#name:focus{outline:none}
b{font-weight:700}
li a,.note a{overflow-wrap:anywhere}
@media (max-width:620px){body{font-size:17px}.t{font-size:1.25rem}.choices{grid-template-columns:1fr}.bar{justify-content:flex-start}body[data-view=home] header{padding-top:3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-view="home">
<div class="wrap">
  <div class="bar">
    <nav class="nav" id="nav" aria-label="Sections">
      <a data-v="home" href="#home"></a>
      <a data-v="resume" href="#resume"></a>
      <a data-v="cv" href="#cv"></a>
    </nav>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" lang="en" title="English">EN</button>
        <button type="button" data-lang="es" lang="es" title="Español">ES</button>
      </div>
      <button type="button" class="btn" id="theme"></button>
    </div>
  </div>

  <header>
    <h1 id="name"></h1>
    <p class="sub" id="sub"></p>
    <p class="contact ui">
      <span>Santiago, Chile</span>
      <a id="mail" href="#"></a>
      <a id="phone" href="#"></a>
      <a href="https://linkedin.com/in/danielfinol" target="_blank" rel="noopener">linkedin.com/in/danielfinol</a>
    </p>
    <noscript><p class="ui">Please enable JavaScript to view this page. / Active JavaScript para ver esta página.</p></noscript>
  </header>

  <main id="view"></main>
</div>
<button type="button" class="totop ui" id="totop"></button>

<script>
(function(){
var D=/*DATA*/null;
var root=document.documentElement;
var $=function(s){return document.querySelector(s)};
var UI={
 en:{nav:{home:'Home',resume:'Résumé',cv:'Full CV'},
     title:{home:'Computer & Data Scientist',resume:'Résumé',cv:'Curriculum vitae'},
     items:function(n){return n+(n===1?' item':' items')},
     light:'Light mode',dark:'Dark mode',expand:'Expand all',collapse:'Collapse all',
     top:'Back to top',pdf:'Download PDF',dl:{resume:'Download this résumé (PDF)',cv:'Download the full CV (PDF)'}},
 es:{nav:{home:'Inicio',resume:'CV resumido',cv:'CV completo'},
     title:{home:'Científico de Computación y Datos',resume:'CV resumido',cv:'Currículum vitae'},
     items:function(n){return n+(n===1?' elemento':' elementos')},
     light:'Modo claro',dark:'Modo oscuro',expand:'Expandir todo',collapse:'Contraer todo',
     top:'Volver arriba',pdf:'Descargar PDF',dl:{resume:'Descargar este CV resumido (PDF)',cv:'Descargar el CV completo (PDF)'}}
};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var lang=store.get('lang');
if(lang!=='en'&&lang!=='es'){
 var nl=(navigator.languages&&navigator.languages[0])||navigator.language||'en';
 lang=String(nl).toLowerCase().indexOf('es')===0?'es':'en';
}
var open={};
var dq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function theme(){return root.dataset.theme||(dq&&dq.matches?'dark':'light')}
function route(){var h=location.hash.replace('#','');return h==='cv'||h==='resume'?h:'home'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(s){return esc(s).replace(/([^]*)/g,'<a href="$1" target="_blank" rel="noopener">').replace(//g,'</a>').replace(//g,'<b>').replace(//g,'</b>').replace(//g,'<i>').replace(//g,'</i>').replace(//g,'<sup>').replace(//g,'</sup>')}
function li(t){
 var p=t.split('\n'),subs=[],notes=[];
 p.slice(1).forEach(function(x){if(x.charAt(0)==='')subs.push(x.slice(1));else notes.push(x)});
 return '<li>'+fmt(p[0])+notes.map(function(x){return '<span class="subl">'+fmt(x)+'</span>'}).join('')+
  (subs.length?'<ul class="in">'+subs.map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul>':'')+'</li>';
}
function view(){var v=route();return v==='home'?null:D[lang][v]}
function allOpen(){var v=route(),V=view();return !!V&&V.sections.every(function(s){return open[v+':'+s.key]})}
function labels(){
 var u=UI[lang];
 $('#theme').textContent=theme()==='dark'?u.light:u.dark;
 $('#totop').innerHTML='<span aria-hidden="true">↑</span> '+esc(u.top);
 var a=$('#all');if(a)a.textContent=allOpen()?u.collapse:u.expand;
 document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang)});
}
function card(k,L,u){
 return '<div class="choice'+(k==='resume'?' main':'')+'"><h2><a href="#'+k+'">'+esc(u.nav[k])+'</a></h2>'+
  '<p class="d">'+esc(L.home.cards[k])+'</p>'+
  '<p class="pdf ui"><a href="'+esc(L[k].pdf)+'" target="_blank" rel="noopener">'+esc(u.pdf)+'</a></p></div>';
}
function render(){
 var L=D[lang],u=UI[lang],v=route(),V=v==='home'?L.home:L[v],h;
 root.lang=lang;
 document.body.dataset.view=v;
 document.title=L.name+' — '+u.title[v];
 $('#name').textContent=L.name;
 $('#sub').textContent=V.sub;
 document.querySelectorAll('#nav a').forEach(function(a){
  a.textContent=u.nav[a.dataset.v];
  if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
 });
 var tel=String.fromCharCode.apply(null,L.phone.slice().reverse()),ph=$('#phone');
 ph.textContent=tel;ph.removeAttribute('href');ph.dataset.tel=tel.replace(/[^+\d]/g,'');
 if(v==='home'){
  h='<div class="home"><p class="lead">'+fmt(V.lead)+'</p><p class="para">'+fmt(V.para)+'</p>'+
    '<div class="choices">'+card('resume',L,u)+card('cv',L,u)+'</div></div>';
 }else{
  h='<div class="vbar"><a href="'+esc(V.pdf)+'" target="_blank" rel="noopener">'+esc(u.dl[v])+'</a>'+
    '<button type="button" class="lnk" id="all"></button></div>';
  if(V.lead)h+='<section class="lsec"><h2>'+esc(V.lead.title)+'</h2><p>'+fmt(V.lead.text)+'</p></section>';
  h+='<div>'+V.sections.map(function(s){
   var k=v+':'+s.key,o=!!open[k];
   return '<section class="sec'+(o?' open':'')+'" data-key="'+k+'">'+
    '<h2><button type="button" id="b-'+s.key+'" aria-expanded="'+o+'" aria-controls="p-'+s.key+'">'+
    '<span class="t">'+esc(s.title)+'</span>'+
    '<span class="m">'+u.items(s.items.length)+'<span class="chev" aria-hidden="true"></span></span>'+
    '<span class="sum">'+esc(s.summary)+'</span></button></h2>'+
    '<div class="panel" id="p-'+s.key+'" role="region" aria-labelledby="b-'+s.key+'"><div class="pin">'+
    (s.note?'<p class="note">'+fmt(s.note)+'</p>':'')+
    '<ul>'+s.items.map(li).join('')+'</ul></div></div></section>';
  }).join('')+'</div>';
 }
 $('#view').innerHTML=h;
 labels();
}
$('#view').addEventListener('click',function(e){
 var all=e.target.closest('#all');
 if(all){
  var v=route(),o=!allOpen();
  view().sections.forEach(function(s){open[v+':'+s.key]=o});
  document.querySelectorAll('.sec').forEach(function(sec){sec.classList.toggle('open',o);sec.querySelector('h2 button').setAttribute('aria-expanded',o)});
  labels();return;
 }
 var b=e.target.closest('.sec h2 button');if(!b)return;
 var sec=b.closest('.sec'),k=sec.dataset.key,o=!open[k];
 open[k]=o;sec.classList.toggle('open',o);b.setAttribute('aria-expanded',o);labels();
});
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;store.set('lang',lang);render()})});
$('#theme').addEventListener('click',function(){
 var t=theme()==='dark'?'light':'dark';
 root.dataset.theme=t;store.set('theme',t);labels();
});
if(dq){try{dq.addEventListener('change',labels)}catch(e){try{dq.addListener(labels)}catch(e2){}}}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
var tt=$('#totop'),tick=false;
function showTop(){tick=false;tt.classList.toggle('show',window.pageYOffset>700)}
window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(showTop)}},{passive:true});
tt.addEventListener('click',function(){
 var calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.scrollTo({top:0,behavior:calm?'auto':'smooth'});
 var n=$('#name');n.tabIndex=-1;n.focus({preventScroll:true});
});
/* Email is assembled at run time so it never appears in the page source. */
var addr=String.fromCharCode.apply(null,D.mail.slice().reverse()),m=$('#mail');
m.textContent=addr;
['pointerdown','focus','mouseover','touchstart','click'].forEach(function(ev){m.addEventListener(ev,function(){m.href='mailto:'+addr})});
['pointerdown','focus','mouseover','touchstart','click'].forEach(function(ev){$('#phone').addEventListener(ev,function(){this.href='tel:'+this.dataset.tel})});
render();
})();
</script>
</body>
</html>
