var $=function(s){return document.querySelector(s)};
var UI={
 en:{cv:'Curriculum vitae',items:function(n){return n+(n===1?' item':' items')},light:'Light mode',dark:'Dark mode',expand:'Expand all',collapse:'Collapse all'},
 es:{cv:'Currículum vitae',items:function(n){return n+(n===1?' elemento':' elementos')},light:'Modo claro',dark:'Modo oscuro',expand:'Expandir todo',collapse:'Contraer todo'}
};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function fmt(s){return esc(s).replace(/\ue004([^\ue005]*)\ue005/g,'<a href="$1" target="_blank" rel="noopener">').replace(/\ue006/g,'</a>').replace(/\ue000/g,'<b>').replace(/\ue001/g,'</b>').replace(/\ue002/g,'<i>').replace(/\ue003/g,'</i>').replace(/\ue007/g,'<sup>').replace(/\ue008/g,'</sup>')}

function render(){

 document.documentElement.lang=lang;

 $('#name').textContent=L.name;

   (s.note?'<p class="note">'+fmt(s.note)+'</p>':'')+

 }).join('');
 labels();
}
$('#sections').addEventListener('click',function(e){
