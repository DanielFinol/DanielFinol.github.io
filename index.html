var dq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function theme(){return root.dataset.theme||(dq&&dq.matches?'dark':'light')}
function route(){var h=location.hash.replace('#','');return h==='cv'||h==='resume'?h:'home'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(s){return esc(s).replace(/([^]*)/g,'<a href="$1" target="_blank" rel="noopener">').replace(//g,'</a>').replace(//g,'<b>').replace(//g,'</b>').replace(//g,'<i>').replace(//g,'</i>').replace(//g,'<sup>').replace(//g,'</sup>')}
function li(t){
 var p=t.split('\n'),subs=[],notes=[];
 p.slice(1).forEach(function(x){if(x.charAt(0)==='')subs.push(x.slice(1));else notes.push(x)});
 return '<li>'+fmt(p[0])+notes.map(function(x){return '<span class="subl">'+fmt(x)+'</span>'}).join('')+
  (subs.length?'<ul class="in">'+subs.map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul>':'')+'</li>';
}
function view(){var v=route();return v==='home'?null:D[lang][v]}
function allOpen(){var v=route(),V=view();return !!V&&V.sections.every(function(s){return open[v+':'+s.key]})}
function labels(){
 var u=UI[lang];
 $('#theme').textContent=theme()==='dark'?u.light:u.dark;
 var a=$('#all');if(a)a.textContent=allOpen()?u.collapse:u.expand;
 document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang)});
}
function card(k,L,u){
 return '<div class="choice'+(k==='resume'?' main':'')+'"><h2><a href="#'+k+'">'+esc(u.nav[k])+'</a></h2>'+
  '<p class="d">'+esc(L.home.cards[k])+'</p>'+
  '<p class="pdf ui"><a href="'+esc(L[k].pdf)+'" target="_blank" rel="noopener">'+esc(u.pdf)+'</a></p></div>';
}
function render(){
 var L=D[lang],u=UI[lang],v=route(),V=v==='home'?L.home:L[v],h;
 root.lang=lang;
 document.body.dataset.view=v;
 document.title=L.name+' — '+u.title[v];
 $('#name').textContent=L.name;
 $('#sub').textContent=V.sub;
 document.querySelectorAll('#nav a').forEach(function(a){
  a.textContent=u.nav[a.dataset.v];
  if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
 });
 var tel=String.fromCharCode.apply(null,L.phone.slice().reverse()),ph=$('#phone');
 ph.textContent=tel;ph.removeAttribute('href');ph.dataset.tel=tel.replace(/[^+\d]/g,'');
 if(v==='home'){
  h='<div class="home"><p class="lead">'+esc(V.lead)+'</p><p class="para">'+esc(V.para)+'</p>'+
    '<div class="choices">'+card('resume',L,u)+card('cv',L,u)+'</div></div>';
 }else{
  h='<div class="vbar"><a href="'+esc(V.pdf)+'" target="_blank" rel="noopener">'+esc(u.dl[v])+'</a>'+
    '<button type="button" class="lnk" id="all"></button></div>';
  if(V.lead)h+='<section class="lsec"><h2>'+esc(V.lead.title)+'</h2><p>'+fmt(V.lead.text)+'</p></section>';
  h+='<div>'+V.sections.map(function(s){
   var k=v+':'+s.key,o=!!open[k];
   return '<section class="sec'+(o?' open':'')+'" data-key="'+k+'">'+
    '<h2><button type="button" id="b-'+s.key+'" aria-expanded="'+o+'" aria-controls="p-'+s.key+'">'+
    '<span class="t">'+esc(s.title)+'</span>'+
    '<span class="m">'+u.items(s.items.length)+'<span class="chev" aria-hidden="true"></span></span>'+
    '<span class="sum">'+esc(s.summary)+'</span></button></h2>'+
    '<div class="panel" id="p-'+s.key+'" role="region" aria-labelledby="b-'+s.key+'"><div class="pin">'+
    (s.note?'<p class="note">'+fmt(s.note)+'</p>':'')+
    '<ul>'+s.items.map(li).join('')+'</ul></div></div></section>';
  }).join('')+'</div>';
 }
 $('#view').innerHTML=h;
 labels();
}
$('#view').addEventListener('click',function(e){
 var all=e.target.closest('#all');
 if(all){
  var v=route(),o=!allOpen();
  view().sections.forEach(function(s){open[v+':'+s.key]=o});
  document.querySelectorAll('.sec').forEach(function(sec){sec.classList.toggle('open',o);sec.querySelector('h2 button').setAttribute('aria-expanded',o)});
  labels();return;
 }
 var b=e.target.closest('.sec h2 button');if(!b)return;
 var sec=b.closest('.sec'),k=sec.dataset.key,o=!open[k];
 open[k]=o;sec.classList.toggle('open',o);b.setAttribute('aria-expanded',o);labels();
});
document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;store.set('lang',lang);render()})});
$('#theme').addEventListener('click',function(){
 var t=theme()==='dark'?'light':'dark';
 root.dataset.theme=t;store.set('theme',t);labels();
});
if(dq){try{dq.addEventListener('change',labels)}catch(e){try{dq.addListener(labels)}catch(e2){}}}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
/* Email is assembled at run time so it never appears in the page source. */
var addr=String.fromCharCode.apply(null,D.mail.slice().reverse()),m=$('#mail');
m.textContent=addr;
['pointerdown','focus','mouseover','touchstart','click'].forEach(function(ev){m.addEventListener(ev,function(){m.href='mailto:'+addr})});
['pointerdown','focus','mouseover','touchstart','click'].forEach(function(ev){$('#phone').addEventListener(ev,function(){this.href='tel:'+this.dataset.tel})});
render();
})();
</script>
</body>
</html>
